<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせありがとうございました | KAGU. matsuyama</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#e8f0e8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --col-bg-hero:#e8f0e8;
  --col-bg-page:#f7f4ef;
  --col-bg-card:#ffffff;
  --col-text-main:#1e3828;
  --col-text-sub:#405848;
  --col-text-muted:#5a7060;
  --col-accent:#c8a870;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",sans-serif;background:var(--col-bg-page);color:var(--col-text-main);min-height:100vh;display:flex;flex-direction:column}

/* ロゴヘッダー */
.logo-wrap{text-align:center;padding:1.5rem 2rem 1rem;background:#FAFAF7;border-bottom:1px solid #e8e4dc}
.logo-svg{display:block;margin:0 auto;height:64px;width:auto}

.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem}
.card{background:var(--col-bg-card);border:1px solid #c8dcc8;border-radius:16px;padding:2.5rem 2rem;max-width:520px;width:100%;text-align:center}
.check{width:64px;height:64px;margin:0 auto 1.5rem}
.title{font-family:"Noto Serif JP",serif;font-size:1.4rem;font-weight:600;margin-bottom:1rem;color:var(--col-text-main);line-height:1.5}
.lead{font-size:14px;color:var(--col-text-sub);line-height:2;margin-bottom:1.5rem}
.note-box{background:#f0f6f0;border:1px solid #c8dcc8;border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.75rem;text-align:left}
.note-box p{font-size:12px;color:var(--col-text-sub);line-height:1.9}
.note-box strong{color:var(--col-text-main)}
.back-link{display:inline-block;background:#1e3828;color:#f0ede6;font-size:14px;font-weight:500;letter-spacing:0.05em;padding:0.85rem 2rem;border-radius:8px;text-decoration:none}
footer{text-align:center;padding:2rem;font-size:11px;line-height:2;background:var(--col-bg-hero);color:var(--col-text-sub);border-top:1px solid #c8dcc8}
</style>
</head>
<body>

<div class="logo-wrap">
  <svg viewBox="0 0 400 140" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
    <text x="200" y="70" text-anchor="middle" font-family="'Cormorant Garamond','Playfair Display',Georgia,serif" font-size="48" font-weight="400" fill="#2C2C2A" letter-spacing="4">KAGU<tspan fill="#854F0B">.</tspan></text>
    <line x1="140" y1="90" x2="260" y2="90" stroke="#888780" stroke-width="0.5"/>
    <text x="200" y="120" text-anchor="middle" font-family="'Cormorant Garamond','Playfair Display',Georgia,serif" font-size="16" font-weight="300" fill="#5F5E5A" letter-spacing="8">matsuyama</text>
  </svg>
</div>

<div class="wrap">
  <div class="card">
    <svg class="check" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="30" fill="#e8f0e8" stroke="#2d4a38" stroke-width="1.5"/>
      <path d="M20 33 L28 41 L44 24" stroke="#2d4a38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <h1 class="title">お問い合わせ<br>ありがとうございました</h1>
    <p class="lead">
      内容を確認のうえ、<strong>最短即日〜2営業日以内</strong>に<br>
      ご入力いただいたメールアドレス宛に<br>
      ご連絡いたします。
    </p>
    <div class="note-box">
      <p><strong>ご返信が届かない場合</strong><br>
      迷惑メールフォルダに振り分けられることがあります。数日経っても返信がない場合は、お手数ですが迷惑メールフォルダをご確認ください。</p>
    </div>
    <div class="note-box">
      <p><strong>お電話でのご連絡について</strong><br>
      ご返信をお待ちしても連絡が取れない場合、お電話番号をご記入いただいた方にはこちらからお電話でご連絡することがあります。</p>
    </div>
    <a class="back-link" href="https://kagu-matsuyama.com/">トップに戻る</a>
  </div>
</div>

<footer>
  © 2026 KAGU. matsuyama | 松山市 出張買取<br>
  古物商許可番号：821080001764
</footer>

</body>
</html>
